<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu painel de tarfas</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cartao-aplicacao">
        <header class="cabecalho-aplicacao">
            <h1>Minhas tarefas</h1>
            <button class="botao-icone" id="botao-altrar-tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        <div class="caixa-entrada">
            <input type="text" name="campo-tarefas" id="lista-tarefa" placeholder="o que vamos fazer hoje?..." max.length="40">
            <button class="botao-principal" id="botao-adicionar"> <i class="fa-solid fa-fa-plus"></i>Adicionar</button>
        </div>
        <ul class="lista-taefas" id="lista-tarefas">
            <!-- as tarefas serão inseridas dinamicamente via javaScript -->
        </ul>
        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">0 tarefas na lista</span>
        </footer>
    </div>


    <script src="script.js"></script>
</body>
</html>
